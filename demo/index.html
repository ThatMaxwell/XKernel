<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XKernel</title>
<meta name="description" content="XKernel showcase: real operating systems, tiled over your wallpaper.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gap: 10px;
    --blur: 24px;
    --accent: #ffffff;
    --radius: 12px;
    --ease: cubic-bezier(.2,.7,.2,1);
    --spring: cubic-bezier(.3,1.25,.5,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }

  /* ---------- wallpaper: two layers so changes cross-fade ---------- */
  .wall { position: fixed; inset: -60px; background: #0b0b0e center/cover no-repeat;
    filter: blur(var(--blur)) brightness(.6) saturate(1.1); transform: scale(1.05);
    transition: filter .6s var(--ease), opacity 1.4s var(--ease); opacity: 0; }
  .wall.on { opacity: 1; }
  body.sleeping .wall { filter: blur(calc(var(--blur) + 16px)) brightness(.25); }

  /* ---------- boot ---------- */
  #boot { position: fixed; inset: 0; background: #000; display: grid; place-items: center; z-index: 80;
    transition: opacity 1s var(--ease); }
  #boot.gone { opacity: 0; pointer-events: none; }
  .logo { width: 120px; }
  #boot .logo { opacity: 0; transform: translateY(14px) scale(.92); transition: opacity 1.1s var(--ease), transform 1.1s var(--ease); }
  #boot .logo.show { opacity: 1; transform: none; }
  #boot .logo.hop { opacity: 0; transform: scale(1.04); transition: opacity .7s ease-in, transform .8s var(--ease); }

  /* ---------- first-boot welcome ---------- */
  #welcome { position: fixed; inset: 0; display: grid; place-items: center; z-index: 70; pointer-events: none; }
  #welcome .words { text-align: center; font-weight: 200; letter-spacing: .02em; transition: all .9s var(--ease); }
  #welcome .l1, #welcome .l2 { opacity: 0; transform: translateY(8px); transition: opacity 1.1s var(--ease), transform 1.1s var(--ease); }
  #welcome .l1 { font-size: clamp(30px, 4.4vw, 56px); }
  #welcome .l2 { font-size: clamp(16px, 2vw, 24px); color: rgba(255,255,255,.7); margin-top: 10px; }
  #welcome .show { opacity: 1; transform: none; }
  #welcome .words.collapse { transform: scale(.06); opacity: 0; filter: blur(6px); }
    #welcome .logo { position: absolute; opacity: 0; transform: scale(.6); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  #welcome .logo.show { opacity: 1; transform: scale(1); }
  #welcome .logo.out { opacity: 0; transform: scale(1.06); }

  #hint { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 8px); opacity: 0; z-index: 30;
    font-size: 13px; color: rgba(255,255,255,.72); letter-spacing: .04em; text-align: center; cursor: pointer;
    transition: opacity 1s var(--ease), transform 1s var(--ease); pointer-events: none; }
  #hint.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  kbd { font-family: "JetBrains Mono", monospace; font-size: 12px; padding: 2px 7px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); }
  #hint small { display: block; margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.38); }

  /* ---------- tiles ---------- */
  #tiles { position: fixed; inset: 0; z-index: 10; }
  .tile { position: absolute; border-radius: var(--radius); overflow: hidden; background: #08080a;
    border: 1px solid rgba(255,255,255,.07); box-shadow: 0 12px 44px rgba(0,0,0,.4);
    transition: left .5s var(--spring), top .5s var(--spring), width .5s var(--spring), height .5s var(--spring),
      opacity .5s var(--ease), filter .6s var(--ease), border-color .3s, transform .5s var(--ease);
    opacity: 0; filter: blur(12px); transform: scale(.97); }
  .tile.in { opacity: 1; filter: none; transform: none; }
  .tile.focus { border-color: color-mix(in srgb, var(--accent) 72%, transparent); }
  .tile.out, .tile.asleep { opacity: 0; filter: blur(18px); transform: scale(.96); }
  .tile.hidden { opacity: 0; pointer-events: none; transform: scale(.94); }
  .tile.drop { border-color: color-mix(in srgb, var(--accent) 40%, transparent); border-style: dashed; }
  .tile .screen { position: absolute; inset: 0; overflow: hidden; }
  .tile .name { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center;
    font-size: 15px; font-weight: 300; letter-spacing: .06em; padding: 10px 16px; border-radius: 10px;
    background: rgba(0,0,0,.6); backdrop-filter: blur(10px); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 6; white-space: nowrap; }
  .tile .name small { display: block; margin-top: 4px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: rgba(255,255,255,.55); letter-spacing: 0; }
  body.names .tile .name { opacity: 1; }
  .tribute { position: absolute; top: 3px; right: 10px; font-size: 13px; color: rgba(255,255,255,.85); z-index: 5; pointer-events: none; }

  /* real guests: v86 screen, scaled to fit the tile */
  .vm { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .vm > div { white-space: pre; font: 14px/14px monospace; color: #ccc; background: #000; }
  .vm canvas { display: none; image-rendering: auto; }
  .vm.pixel canvas { image-rendering: pixelated; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; background: #050506; z-index: 3;
    transition: opacity .6s var(--ease); font: 12px "JetBrains Mono", monospace; color: rgba(255,255,255,.55); }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading .box { width: min(260px, 70%); text-align: center; }
  .loading .bar { height: 2px; margin-top: 12px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s var(--ease); }
  .loading .err { color: #ff8a8a; }

  /* mock guests (things we can't or won't host: Windows, TempleOS, other distros) */
  .term { font: 13px/1.5 "JetBrains Mono", monospace; padding: 14px 16px; color: #d6d6d6; background: #0d0f12; height: 100%; white-space: pre-wrap; overflow: hidden; }
  .term .c { color: #7aa2f7; } .term .g { color: #9ece6a; } .term .y { color: #e0af68; } .term .m { color: #bb9af7; } .term .d { color: #565f89; }
  .win { height: 100%; background: linear-gradient(160deg, #0a3d91, #1b6fd1 60%, #4ea3ff); position: relative; }
  .win .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 38px; background: rgba(20,20,28,.82); backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .win .bar i { width: 22px; height: 22px; border-radius: 5px; background: rgba(255,255,255,.18); display: block; }
  .win .bar i:first-child { background: rgba(120,190,255,.7); }
  .win .w { position: absolute; left: 12%; top: 14%; width: 56%; height: 46%; background: #f3f3f3; border-radius: 8px; color: #222;
    font: 12px Inter, sans-serif; padding: 34px 14px 10px; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .win .w::before { content: "Notepad"; position: absolute; top: 8px; left: 12px; color: #555; }
  .temple { height: 100%; background: #fff; color: #000; font: 14px/1.35 "Courier New", monospace; padding: 10px 14px; overflow: hidden; white-space: pre-wrap; }
  .temple .b { color: #0000aa; } .temple .r { color: #aa0000; } .temple .gr { color: #00aa00; } .temple .p { color: #aa00aa; }
  .temple .top { background: #0000aa; color: #fff; margin: -10px -14px 8px; padding: 2px 14px; }
  .mockflag { position: absolute; left: 10px; bottom: 8px; font: 10px "JetBrains Mono", monospace; color: rgba(255,255,255,.35); z-index: 4; pointer-events: none; }
  .temple + .mockflag, .win + .mockflag { color: rgba(0,0,0,.35); }

  /* ---------- xsh ---------- */
  #xsh { position: fixed; left: 50%; top: 26%; width: min(660px, calc(100vw - 32px)); z-index: 60;
    transform: translate(-50%, 10px) scale(.985); opacity: 0; pointer-events: none;
    background: rgba(14,14,18,.74); backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px; box-shadow: 0 30px 90px rgba(0,0,0,.55);
    font-family: "JetBrains Mono", monospace; transition: opacity .22s var(--ease), transform .28s var(--spring); user-select: text; }
  #xsh.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
  #xsh .log { max-height: 48vh; overflow-y: auto; padding: 12px 16px 0; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,.72); white-space: pre-wrap; }
  #xsh .log:empty { padding: 0; }
  #xsh .log .cmd { color: #fff; } #xsh .log .err { color: #ff8a8a; } #xsh .log .dim { color: rgba(255,255,255,.4); } #xsh .log .ok { color: #b9f6ca; }
  #xsh .row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; position: relative; }
  #xsh .row > span { color: var(--accent); }
  #xsh .field { position: relative; flex: 1; }
  #xsh input, #xsh .ghost { width: 100%; font: 14px "JetBrains Mono", monospace; padding: 0; border: 0; }
  #xsh input { position: relative; background: transparent; outline: 0; color: #fff; caret-color: var(--accent); z-index: 1; }
  #xsh .ghost { position: absolute; left: 0; top: 0; color: rgba(255,255,255,.28); white-space: pre; pointer-events: none; }
  #xsh .keys { padding: 0 16px 12px; font-size: 11px; color: rgba(255,255,255,.32); display: flex; gap: 14px; flex-wrap: wrap; }

  /* ---------- sleep ---------- */
  #sleep { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity 1s var(--ease); }
  #sleep.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  #sleep .box { text-align: center; font-weight: 200; }
  #sleep .logo { width: 64px; margin: 0 auto 22px; opacity: .9; }
  #sleep .t { font-size: 22px; letter-spacing: .02em; }
  #sleep .s { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.5); }

  /* ---------- fps ---------- */
  #fps { position: fixed; right: 14px; top: 10px; z-index: 65; font: 11px "JetBrains Mono", monospace; color: rgba(255,255,255,.55); display: none; pointer-events: none; }

  @media (max-width: 640px) { :root { --gap: 6px; } .term { font-size: 11px; } #xsh { top: 14%; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="wall" id="wallA"></div><div class="wall" id="wallB"></div>

  <div id="boot"><img class="logo mark" src="logo-light.svg" alt="XKernel"></div>

  <div id="welcome">
    <div class="words"><div class="l1">Welcome.</div><div class="l2">You are now inside XKernel.</div></div>
    <img class="logo mark" src="logo-light.svg" alt="">
  </div>

  <div id="hint">Press <kbd>⊞</kbd> + <kbd>Space</kbd> to open xsh.<small>in this browser demo: Ctrl + Space, or click here</small></div>

  <div id="tiles"></div>

  <div id="sleep"><div class="box"><img class="logo mark" src="logo-light.svg" alt=""><div class="t">Your kernels are asleep.</div><div class="s">Press any key to continue.</div></div></div>

  <div id="fps"></div>

  <div id="xsh" role="dialog" aria-label="xsh">
    <div class="log" id="log"></div>
    <div class="row"><span>›</span><div class="field"><div class="ghost" id="ghost"></div><input id="in" autocomplete="off" spellcheck="false" aria-label="xsh command"></div></div>
    <div class="keys"><span><kbd>Tab</kbd> complete</span><span><kbd>↑</kbd><kbd>↓</kbd> history</span><span><kbd>Esc</kbd> close</span><span><kbd>help</kbd></span></div>
  </div>

<script src="v86/libv86.js"></script>
<script>
/*
 * XKernel showcase.
 * "Real" kernels are actual operating systems booted in your browser by v86 (an open-source x86 emulator, BSD-2).
 * Real XKernel would run them on hardware through KVM; v86 is the closest a web page can get.
 * The small disk images in images/ come from v86's public image set. Bigger OSes and Windows are mock tiles.
 */
const $ = s => document.querySelector(s);
const boot = $('#boot'), welcome = $('#welcome'), hint = $('#hint'), tilesEl = $('#tiles');
const xsh = $('#xsh'), log = $('#log'), input = $('#in'), ghost = $('#ghost');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MB = 1024 * 1024;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- IndexedDB: where kernels sleep ---------- */
const idb = (() => {
  let dbp;
  const db = () => dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open('xkernel', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('states');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => {
    const t = d.transaction('states', mode); const q = fn(t.objectStore('states'));
    t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
  return {
    put: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}),
    get: k => tx('readonly', s => s.get(k)).catch(() => undefined),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => {}),
  };
})();

/* ---------- wallpaper ---------- */
let wallFront = $('#wallA'), wallBack = $('#wallB');
function setWallpaper(seed) {
  seed ||= Math.random().toString(36).slice(2, 8);
  store.set('xk-wall', seed);
  const url = `https://picsum.photos/seed/${seed}/1920/1080`;
  const img = new Image();
  const show = bg => {
    wallBack.style.background = bg; wallBack.style.backgroundSize = 'cover'; wallBack.style.backgroundPosition = 'center';
    wallBack.classList.add('on'); wallFront.classList.remove('on');
    [wallFront, wallBack] = [wallBack, wallFront];
  };
  img.onload = () => show(`url(${url})`);
  img.onerror = () => show('radial-gradient(circle at 30% 30%, #2b3a55, #0b0b0e 70%)');
  img.src = url;
  return seed;
}

/* ---------- the catalog ---------- */
const H = 'images/'; // small open-source images, served locally
const REAL = {
  buildroot: { name: 'Buildroot Linux', family: 'linux', mem: 128, note: 'boots a tiny Linux from scratch',
               cfg: { memory_size: 128 * MB, bzimage: { url: H + 'buildroot-bzimage.bin', size: 5166352, async: false },
                      cmdline: 'tsc=reliable mitigations=off random.trust_cpu=on', filesystem: {} } },
  tinycore:  { name: 'Tiny Core Linux', family: 'linux', mem: 256, note: '20 MB desktop Linux',
               cfg: { memory_size: 256 * MB, hda: { url: H + 'TinyCore-11.0.iso', size: 19922944, async: false } } },
  dsl:       { name: 'Damn Small Linux', family: 'linux', mem: 256, note: '50 MB live CD',
               cfg: { memory_size: 256 * MB, cdrom: { url: H + 'dsl-4.11.rc2.iso', size: 52824064, async: false } } },
  kolibrios: { name: 'KolibriOS', mem: 64, note: 'a whole GUI OS in 1.4 MB of assembly',
               cfg: { memory_size: 64 * MB, fda: { url: H + 'kolibri.img', size: 1474560 } } },
  freedos:   { name: 'FreeDOS', mem: 32, note: 'open-source DOS', pixel: true,
               cfg: { memory_size: 32 * MB, fda: { url: H + 'freedos722.img', size: 737280 } } },
  helenos:   { name: 'HelenOS', mem: 256, note: 'microkernel research OS',
               cfg: { memory_size: 256 * MB, cdrom: { url: H + 'HelenOS-0.14.1-ia32.iso', size: 25792512, async: false } } },
};
const MOCK_DISTROS = ['arch', 'nixos', 'debian', 'fedora', 'gentoo', 'void', 'alpine', 'ubuntu', 'opensuse', 'mint', 'endeavouros', 'kali', 'popos', 'manjaro', 'slackware'];
const MOCK = {
  windows:     { name: 'Windows', note: 'bring your own license · mock tile' },
  templeos:    { name: 'TempleOS', note: 'mock tile', tribute: '✝' },
  openindiana: { name: 'OpenIndiana', note: 'illumos · mock tile' },
  haiku:       { name: 'Haiku', note: 'mock tile' },
  freebsd:     { name: 'FreeBSD', note: 'mock tile' },
  openbsd:     { name: 'OpenBSD', note: 'mock tile' },
  '9front':    { name: '9front (Plan 9)', note: 'mock tile' },
  reactos:     { name: 'ReactOS', note: 'mock tile' },
  serenity:    { name: 'SerenityOS', note: 'mock tile' },
};
const ALIASES = { win: 'windows', win11: 'windows', bsd: 'freebsd', oi: 'openindiana', illumos: 'openindiana', temple: 'templeos',
  plan9: '9front', 'plan 9': '9front', kolibri: 'kolibrios', dos: 'freedos', react: 'reactos', serenityos: 'serenity',
  helen: 'helenos', tiny: 'tinycore', tc: 'tinycore', damnsmall: 'dsl' };
const REFUSE = { macos: "macOS isn't available. Apple's license only allows it on Apple hardware.",
  osx: "macOS isn't available. Apple's license only allows it on Apple hardware.",
  ios: "iOS can't be virtualized legally. A real XKernel can mirror a connected iPhone instead." };
const MEM_BUDGET = 1536; // MB of guest RAM the demo will hand out

/* ---------- tiles ---------- */
let tiles = [], focus = -1, nextId = 1, fullscreen = null, xshOpen = false, asleep = false;

function realMemInUse() { return tiles.reduce((a, t) => a + (t.real ? REAL[t.key].mem : 0), 0); }

function saveLayout() {
  store.set('xk-tiles', JSON.stringify(tiles.map(t => ({ id: t.id, key: t.key, distro: t.distro }))));
  store.set('xk-next', String(nextId));
}

function layout() {
  const g = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap')) || 10;
  const vis = tiles.filter(t => !fullscreen || t === fullscreen);
  const rects = [];
  (function split(n, x, y, w, h, vertical) { // dwindle, like Hyprland
    if (n <= 0) return;
    if (n === 1) { rects.push({ x, y, w, h }); return; }
    if (vertical) { const w1 = (w - g) / 2; rects.push({ x, y, w: w1, h }); split(n - 1, x + w1 + g, y, w1, h, !vertical); }
    else { const h1 = (h - g) / 2; rects.push({ x, y, w, h: h1 }); split(n - 1, x, y + h1 + g, w, h1, !vertical); }
  })(vis.length, g, g, innerWidth - 2 * g, innerHeight - 2 * g, innerWidth >= innerHeight);
  tiles.forEach((t, i) => {
    const vi = vis.indexOf(t);
    t.el.classList.toggle('hidden', vi < 0);
    if (vi >= 0) {
      const r = rects[vi];
      Object.assign(t.el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    }
    t.el.classList.toggle('focus', i === focus && tiles.length > 1);
  });
  routeInput();
  requestAnimationFrame(() => tiles.forEach(fitVm));
  setTimeout(() => tiles.forEach(fitVm), 520);
}
addEventListener('resize', layout);

/* input goes only to the focused kernel, and nowhere while xsh is open */
function routeInput() {
  tiles.forEach((t, i) => {
    if (!t.emu) return;
    const on = i === focus && !xshOpen && !asleep;
    try { t.emu.keyboard_set_enabled(on); t.emu.mouse_set_enabled(on && t.hover); } catch {}
  });
}

function fitVm(t) {
  if (!t.vm || !t.emu) return;
  const cv = t.vm.querySelector('canvas'), tx = t.vm.querySelector('div');
  const graphical = cv.style.display !== 'none' && cv.width > 0;
  const w = graphical ? cv.width : tx.offsetWidth, h = graphical ? cv.height : tx.offsetHeight;
  if (!w || !h) return;
  const W = t.el.clientWidth, Hh = t.el.clientHeight;
  const s = Math.min(W / w, Hh / h);
  t.vm.style.transform = `translate(${(W - w * s) / 2}px, ${(Hh - h * s) / 2}px) scale(${s})`;
  t.vm.classList.toggle('pixel', s > 1.01 || REAL[t.key]?.pixel);
}

function tileShell(label, sub, tribute) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML = `<div class="screen"></div><div class="name">${label}<small>${sub}</small></div>${tribute ? `<div class="tribute" title="Tribute to Terry A. Davis">${tribute}</div>` : ''}`;
  tilesEl.appendChild(el);
  return el;
}

function resolve(word, arg) {
  word = (word || '').toLowerCase(); arg = (arg || '').toLowerCase();
  if (REFUSE[word]) return { refuse: REFUSE[word] };
  if (word === 'linux') {
    const d = arg || 'buildroot';
    if (REAL[d]?.family === 'linux') return { key: d, real: true };
    return { key: 'linux', distro: d, real: false };
  }
  word = ALIASES[word] || word;
  if (REAL[word]) return { key: word, real: true };
  if (MOCK[word]) return { key: word, real: false };
  if (MOCK_DISTROS.includes(word)) return { key: 'linux', distro: word, real: false };
  return null;
}

async function startKernel(word, arg, opts = {}) {
  const r = resolve(word, arg);
  if (!r) return [`unknown kernel "${word}". try: list`, 'err'];
  if (r.refuse) return [r.refuse, 'err'];
  if (tiles.length >= 6) return ['six kernels is the limit in this demo. close one first.', 'err'];
  if (r.real && realMemInUse() + REAL[r.key].mem > MEM_BUDGET)
    return [`not enough memory: ${REAL[r.key].name} wants ${REAL[r.key].mem} MB, ${MEM_BUDGET - realMemInUse()} MB left. close a kernel first.`, 'err'];

  const id = opts.id ?? nextId++;
  const t = { id, key: r.key, distro: r.distro, real: r.real, hover: false };
  if (r.real) {
    const p = REAL[r.key];
    t.label = p.name;
    t.el = tileShell(p.name, `kernel ${id} · real · ${p.mem} MB · ${p.note}`);
  } else if (r.key === 'linux') {
    const d = r.distro;
    t.label = `Linux · ${d}`;
    t.el = tileShell(t.label, `kernel ${id} · mock tile · real Linux: start linux buildroot`);
  } else {
    const m = MOCK[r.key];
    t.label = m.name;
    t.el = tileShell(m.name, `kernel ${id} · ${m.note}`, m.tribute);
  }
  t.screen = t.el.querySelector('.screen');
  t.el.addEventListener('mousedown', e => onTileMouseDown(e, t));
  t.el.addEventListener('mouseenter', () => { t.hover = true; routeInput(); });
  t.el.addEventListener('mouseleave', () => { t.hover = false; routeInput(); });
  tiles.push(t);
  focus = tiles.length - 1;
  if (fullscreen) fullscreen = null;
  layout();
  requestAnimationFrame(() => requestAnimationFrame(() => t.el.classList.add('in')));
  saveLayout();

  if (r.real) bootReal(t, opts.resume);
  else setTimeout(() => { t.screen.innerHTML = mockHtml(t); }, 700 + Math.random() * 500);
  return [`${t.label} ${opts.resume ? 'resuming' : 'starting'}  ·  kernel ${id}`, 'ok'];
}

async function bootReal(t, resume) {
  const p = REAL[t.key];
  t.screen.innerHTML = `<div class="vm"><div></div><canvas></canvas></div>
    <div class="loading"><div class="box"><div class="msg">${resume ? 'waking' : 'starting'} ${p.name.toLowerCase()}…</div><div class="bar"><i></i></div></div></div>`;
  t.vm = t.screen.querySelector('.vm');
  const loading = t.screen.querySelector('.loading'), bar = loading.querySelector('.bar i'), msg = loading.querySelector('.msg');

  const cfg = structuredClone(p.cfg);
  const saved = await idb.get('k' + t.id);
  if (saved) cfg.initial_state = { buffer: saved };
  if (!tiles.includes(t)) return;

  let emu;
  try {
    emu = new V86({
      wasm_path: 'v86/v86.wasm',
      bios: { url: 'v86/seabios.bin' },
      vga_bios: { url: 'v86/vgabios.bin' },
      screen_container: t.vm,
      autostart: true,
      disable_keyboard: false,
      disable_mouse: false,
      disable_speaker: true,
      ...cfg,
    });
  } catch (e) {
    msg.innerHTML = `<span class="err">couldn't start ${p.name}: ${e.message}</span>`;
    return;
  }
  t.emu = emu;
  const loaded = {};
  emu.add_listener('download-progress', e => {
    if (!e.lengthComputable || !e.total) return;
    loaded[e.file_name] = [e.loaded, e.total];
    const [l, tot] = Object.values(loaded).reduce((a, [x, y]) => [a[0] + x, a[1] + y], [0, 0]);
    bar.style.width = Math.min(100, (l / tot) * 100) + '%';
    msg.textContent = `${saved ? 'waking' : 'loading'} ${p.name.toLowerCase()} · ${(l / MB).toFixed(1)} / ${(tot / MB).toFixed(1)} MB`;
  });
  emu.add_listener('download-error', () => { msg.innerHTML = `<span class="err">download failed. check your connection.</span>`; });
  emu.add_listener('emulator-started', () => {
    loading.classList.add('done');
    setTimeout(() => fitVm(t), 50);
    routeInput();
  });
  emu.add_listener('screen-set-size', () => requestAnimationFrame(() => fitVm(t)));
  // text mode changes size without the event sometimes; keep it fitted
  t.fitTimer = setInterval(() => fitVm(t), 1000);
}

function mockHtml(t) {
  const flag = '<div class="mockflag">mock tile</div>';
  if (t.key === 'linux') {
    const d = t.distro, D = d[0].toUpperCase() + d.slice(1);
    return `<div class="term"><span class="g">maxwell@${d}</span>:<span class="c">~</span>$ fastfetch
<span class="c">  OS</span>      ${D} Linux (XKernel guest)
<span class="c">  Kernel</span>  linux 6.12 (KVM)
<span class="c">  CPU</span>     4 vCPUs (pinned)
<span class="c">  Memory</span>  1.1 GiB / 8 GiB
<span class="c">  GPU</span>     virtio-gpu (venus)

<span class="d"># any distro runs on XKernel. this one is a mock tile;
# for a real Linux booting in your browser: start linux buildroot</span>
<span class="g">maxwell@${d}</span>:<span class="c">~</span>$ <span class="y">_</span></div>${flag}`;
  }
  if (t.key === 'windows') return `<div class="win"><div class="w">This tile is a Windows guest (mock).<br><br>On real XKernel, Windows gets a GPU through passthrough and runs at native speed. Bring your own license.<br><br>Want an open Windows-compatible OS running for real? Type <b>start reactos</b>.</div><div class="bar"><i></i><i></i><i></i><i></i><i></i></div></div>${flag}`;
  if (t.key === 'templeos') return `<div class="temple"><div class="top">TempleOS  —  Terry A. Davis</div><span class="b">C:/Home&gt;</span> <span class="r">Dir;</span>
<span class="gr">Doc</span>   <span class="gr">Demo</span>   <span class="gr">Apps</span>   <span class="p">Adam</span>
<span class="b">C:/Home&gt;</span> <span class="r">"Hello from HolyC\\n";</span>
Hello from HolyC
<span class="b">C:/Home&gt;</span> _</div>${flag}`;
  const cards = {
    haiku: ['#336698', '#ffcb00', 'Haiku', 'the open-source successor to BeOS'],
    freebsd: ['#1b0f10', '#ab2b28', 'FreeBSD', 'the BSD that powers parts of Netflix and PlayStation'],
    openbsd: ['#11161c', '#f2c94c', 'OpenBSD', 'secure by default'],
    '9front': ['#777777', '#ffffea', '9front', 'Plan 9 from Bell Labs, everything is a file'],
    reactos: ['#0b2a4a', '#4ea3ff', 'ReactOS', 'an open-source Windows-compatible OS'],
    serenity: ['#a7a7a7', '#000080', 'SerenityOS', 'a 90s-style OS built from scratch'],
  };
  if (cards[t.key]) { const [bg, fg, n, d] = cards[t.key];
    return `<div style="height:100%;display:grid;place-items:center;background:${bg};text-align:center;padding:20px"><div><div style="font:500 22px Inter,sans-serif;color:${fg}">${n}</div><div style="margin-top:8px;font:12px 'JetBrains Mono',monospace;color:rgba(255,255,255,.75)">${d}<br><br>on real XKernel this runs on hardware.<br>real kernels in this demo: type list</div></div></div>${flag}`; }
  if (t.key === 'openindiana') return `<div class="term"><span class="y">OpenIndiana Hipster</span> (illumos)

<span class="g">maxwell@oi</span>:~$ zfs list
NAME              USED  AVAIL  REFER
rpool            9.1G  31.2G    33K
rpool/ROOT       6.4G  31.2G    24K
<span class="g">maxwell@oi</span>:~$ <span class="y">_</span></div>${flag}`;
  return '';
}

async function closeKernel(i) {
  const t = tiles[i];
  if (!t) return null;
  tiles.splice(i, 1);
  if (fullscreen === t) fullscreen = null;
  focus = Math.min(focus, tiles.length - 1);
  t.el.classList.add('out');
  clearInterval(t.fitTimer);
  if (t.emu) { try { await t.emu.destroy(); } catch {} }
  idb.del('k' + t.id);
  setTimeout(() => t.el.remove(), 550);
  layout(); saveLayout();
  return t;
}

/* Alt+drag a tile onto another to swap them; plain click focuses */
let drag = null;
function onTileMouseDown(e, t) {
  const i = tiles.indexOf(t);
  if (i !== focus) { focus = i; layout(); }
  if (!e.altKey) return;
  e.preventDefault(); e.stopPropagation();
  drag = { t };
  const move = ev => {
    tiles.forEach(o => o.el.classList.remove('drop'));
    const over = document.elementsFromPoint(ev.clientX, ev.clientY).map(n => n.closest?.('.tile')).find(Boolean);
    const o = tiles.find(x => x.el === over);
    if (o && o !== t) { o.el.classList.add('drop'); drag.over = o; } else drag.over = null;
  };
  const up = () => {
    removeEventListener('mousemove', move, true); removeEventListener('mouseup', up, true);
    tiles.forEach(o => o.el.classList.remove('drop'));
    if (drag?.over) swap(tiles.indexOf(t), tiles.indexOf(drag.over));
    drag = null;
  };
  addEventListener('mousemove', move, true); addEventListener('mouseup', up, true);
}
function swap(a, b) {
  if (a < 0 || b < 0 || a === b) return;
  [tiles[a], tiles[b]] = [tiles[b], tiles[a]];
  focus = b; layout(); saveLayout();
}
function moveFocus(dir) {
  if (tiles.length < 2) return;
  const cur = tiles[focus].el.getBoundingClientRect();
  const cx = cur.left + cur.width / 2, cy = cur.top + cur.height / 2;
  let best = -1, bestD = Infinity;
  tiles.forEach((t, i) => {
    if (i === focus || t.el.classList.contains('hidden')) return;
    const r = t.el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const dx = x - cx, dy = y - cy;
    const ok = dir === 'left' ? dx < -5 : dir === 'right' ? dx > 5 : dir === 'up' ? dy < -5 : dy > 5;
    if (!ok) return;
    const d = Math.hypot(dx, dy) + (dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx)) * 2;
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best >= 0) return best;
}

/* ---------- save, sleep, resume ---------- */
async function saveAll(quiet) {
  const real = tiles.filter(t => t.emu);
  const results = [];
  for (const t of real) {
    try { const st = await t.emu.save_state(); await idb.put('k' + t.id, st); results.push(`${t.label} saved · ${(st.byteLength / MB).toFixed(0)} MB`); }
    catch (e) { results.push(`${t.label} couldn't be saved: ${e.message}`); }
  }
  tiles.filter(t => !t.emu).forEach(t => results.push(`${t.label} saved`));
  saveLayout();
  if (!quiet) results.forEach(r => say(r, r.includes("couldn't") ? 'err' : 'ok'));
  return results;
}

async function goToSleep() {
  closeXsh();
  asleep = true; routeInput();
  await saveAll(true);
  for (const t of tiles) { t.el.classList.add('asleep'); try { await t.emu?.stop(); } catch {} await sleep(180); }
  document.body.classList.add('sleeping');
  await sleep(500);
  $('#sleep').classList.add('show');
}
async function wake() {
  if (!asleep) return;
  $('#sleep').classList.remove('show');
  document.body.classList.remove('sleeping');
  await sleep(400);
  for (const t of tiles) { t.el.classList.remove('asleep'); try { await t.emu?.run(); } catch {} await sleep(160); }
  asleep = false; routeInput();
}
$('#sleep').addEventListener('click', wake);

/* ---------- xsh ---------- */
function say(text, cls = '') { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }

const COMMANDS = ['start', 'list', 'kernels', 'close', 'focus', 'full', 'swap', 'save', 'sleep', 'look', 'wallpaper', 'names', 'fps', 'firstboot', 'clear', 'help', 'about'];
const LOOK = ['blur', 'gap', 'accent', 'radius'];
const START_WORDS = ['linux', ...Object.keys(REAL).filter(k => REAL[k].family !== 'linux'), ...Object.keys(MOCK)];
const LINUX_WORDS = [...Object.keys(REAL).filter(k => REAL[k].family === 'linux'), ...MOCK_DISTROS];

const HELP = `kernels
  start <os>            start a kernel. real ones boot in your browser.
  start linux <distro>  any distro. buildroot, tinycore, dsl are real.
  list                  everything that can run
  kernels               what's running, and the memory it takes
  close [n|all]         close kernel n, the focused one, or all
  focus <n> · swap <a> <b> · full
save
  save                  save every kernel's state (real ones: the whole machine)
  sleep                 save everything and sleep. reload the page: it all comes back.
look
  look blur|gap|radius <n> · look accent <#hex> · wallpaper · names · fps
keys
  Ctrl+Space  xsh        Alt+arrows  focus       Alt+Shift+arrows  swap
  Alt+F       full       Alt+Q       close       Alt+drag          swap tiles
  hold Alt    names`;

function completions(text) {
  const parts = text.split(' ');
  const last = parts[parts.length - 1].toLowerCase();
  let pool = [];
  if (parts.length === 1) pool = COMMANDS;
  else if (['start', 'run', 'open'].includes(parts[0]) && parts.length === 2) pool = START_WORDS;
  else if (['start', 'run', 'open'].includes(parts[0]) && parts[1] === 'linux' && parts.length === 3) pool = LINUX_WORDS;
  else if (parts[0] === 'look' && parts.length === 2) pool = LOOK;
  else if (['close', 'focus'].includes(parts[0]) && parts.length === 2) pool = [...tiles.map(t => String(t.id)), 'all'];
  return pool.filter(w => w.startsWith(last) && w !== last);
}
function updateGhost() {
  const v = input.value, c = v ? completions(v)[0] : '';
  const last = v.split(' ').pop();
  ghost.textContent = c ? v + c.slice(last.length) : '';
}
const history = JSON.parse(store.get('xk-history') || '[]');
let hIndex = history.length;

async function run(line) {
  const raw = line.trim();
  if (!raw) return;
  history.push(raw); if (history.length > 50) history.shift(); hIndex = history.length;
  store.set('xk-history', JSON.stringify(history));
  const [cmd, a, b] = raw.split(/\s+/);
  say('› ' + raw, 'cmd');
  const root = document.documentElement.style;
  switch (cmd.toLowerCase()) {
    case 'help': case '?': say(HELP); break;
    case 'about': say('XKernel showcase. Real kernels are booted in your browser by v86 (open source, BSD-2).
On real XKernel they run on hardware through KVM. Images are served from this demo.', 'dim'); break;
    case 'list':
      say('real, booting in your browser:');
      Object.entries(REAL).forEach(([k, p]) => say(`  ${(p.family === 'linux' ? 'linux ' + k : k).padEnd(17)} ${p.name} · ${p.mem} MB · ${p.note}`));
      say('mock tiles:');
      say('  ' + Object.keys(MOCK).join(' · '));
      say('  linux <' + MOCK_DISTROS.slice(0, 6).join('|') + '|…>   any distro you can name');
      say('not available: macos, ios (Apple license)', 'dim'); break;
    case 'kernels': case 'ps':
      if (!tiles.length) { say('nothing running. try: start linux buildroot', 'dim'); break; }
      tiles.forEach((t, i) => say(`  ${String(t.id).padStart(2)}  ${t.label.padEnd(20)} ${t.real ? REAL[t.key].mem + ' MB · real' : 'mock'}${i === focus ? '  ← focused' : ''}`));
      say(`  memory: ${realMemInUse()} / ${MEM_BUDGET} MB`, 'dim'); break;
    case 'start': case 'run': case 'open': {
      if (!a) { say('start what? try: start linux buildroot', 'err'); break; }
      const [msg, cls] = await startKernel(a, b); say(msg, cls); break; }
    case 'close': case 'kill': {
      if (a === 'all') { const n = tiles.length; while (tiles.length) await closeKernel(0); say(`closed ${n} kernel${n === 1 ? '' : 's'}`); break; }
      const i = a ? tiles.findIndex(t => t.id === +a) : focus;
      const t = await closeKernel(i); say(t ? `${t.label} closed` : 'no such kernel', t ? '' : 'err'); break; }
    case 'focus': { const i = tiles.findIndex(t => t.id === +a); if (i < 0) { say('no such kernel', 'err'); break; } focus = i; fullscreen = null; layout(); say(`focused ${tiles[i].label}`); break; }
    case 'swap': { const x = tiles.findIndex(t => t.id === +a), y = tiles.findIndex(t => t.id === +b); if (x < 0 || y < 0) { say('swap <kernel> <kernel>', 'err'); break; } swap(x, y); say('swapped'); break; }
    case 'full': toggleFull(); say(fullscreen ? `${fullscreen.label} fullscreen` : 'tiled'); break;
    case 'save': await saveAll(); break;
    case 'sleep': goToSleep(); break;
    case 'look': {
      const v = b;
      if (a === 'blur' && v !== undefined && !isNaN(v)) { root.setProperty('--blur', Math.max(0, Math.min(60, +v)) + 'px'); store.set('xk-blur', v); say(`blur ${v}`); }
      else if (a === 'gap' && v !== undefined && !isNaN(v)) { root.setProperty('--gap', Math.max(0, Math.min(40, +v)) + 'px'); store.set('xk-gap', v); layout(); say(`gap ${v}`); }
      else if (a === 'radius' && v !== undefined && !isNaN(v)) { root.setProperty('--radius', Math.max(0, Math.min(32, +v)) + 'px'); store.set('xk-radius', v); say(`radius ${v}`); }
      else if (a === 'accent' && /^#?[0-9a-f]{6}$/i.test(v || '')) { const c = v.startsWith('#') ? v : '#' + v; root.setProperty('--accent', c); store.set('xk-accent', c); say(`accent ${c}`); }
      else say('look blur <n> | look gap <n> | look radius <n> | look accent <#hex>', 'err');
      break; }
    case 'wallpaper': say('wallpaper ' + setWallpaper()); break;
    case 'names': flashNames(); say('names shown'); break;
    case 'fps': { const f = $('#fps'); const on = f.style.display !== 'block'; f.style.display = on ? 'block' : 'none'; say(on ? 'fps on' : 'fps off'); break; }
    case 'firstboot': location.search = '?firstboot'; break;
    case 'clear': log.innerHTML = ''; break;
    default: {
      const r = resolve(cmd, a);
      if (r && !r.refuse) { const [msg, cls] = await startKernel(cmd, a); say(msg, cls); }
      else say(`unknown command "${cmd}". type help`, 'err');
    }
  }
}

function openXsh(prefill = '') {
  if (asleep) return;
  if (hint.classList.contains('show')) { hint.classList.remove('show'); store.set('xk-seen-xsh', '1'); }
  xshOpen = true; routeInput();
  xsh.classList.add('open');
  if (!log.childElementCount) say('xsh · the XKernel shell. type help, or try: start linux buildroot', 'dim');
  input.value = prefill; updateGhost();
  setTimeout(() => input.focus(), 30);
}
function closeXsh() { xshOpen = false; xsh.classList.remove('open'); input.blur(); routeInput(); }

function toggleFull() {
  if (!tiles.length) return;
  fullscreen = fullscreen ? null : tiles[focus];
  layout();
}
let namesTimer;
function flashNames(ms = 1600) { document.body.classList.add('names'); clearTimeout(namesTimer); namesTimer = setTimeout(() => document.body.classList.remove('names'), ms); }

/* keys are handled in the capture phase so XKernel's shortcuts never reach a guest */
addEventListener('keydown', e => {
  if (asleep) { e.preventDefault(); e.stopImmediatePropagation(); wake(); return; }
  if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); e.stopImmediatePropagation(); xshOpen ? closeXsh() : openXsh(); return; }
  if (xshOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeXsh(); }
    return;
  }
  if (e.altKey) {
    const arrows = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    let handled = true;
    if (arrows[e.key]) {
      const n = moveFocus(arrows[e.key]);
      if (n !== undefined) { if (e.shiftKey) swap(focus, n); else { focus = n; layout(); } }
    } else if (e.code === 'KeyF') toggleFull();
    else if (e.code === 'KeyQ') closeKernel(focus);
    else if (e.key === 'Enter') openXsh('start ');
    else if (e.key === 'Alt') { document.body.classList.add('names'); handled = false; }
    else handled = false;
    if (handled || e.key === 'Alt') { e.preventDefault(); e.stopImmediatePropagation(); }
  }
}, true);
addEventListener('keyup', e => { if (e.key === 'Alt') { e.preventDefault(); document.body.classList.remove('names'); } }, true);
addEventListener('blur', () => document.body.classList.remove('names'));

hint.addEventListener('click', () => openXsh());
input.addEventListener('input', updateGhost);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = input.value; input.value = ''; ghost.textContent = ''; run(v); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const c = completions(input.value)[0];
    if (c) { const parts = input.value.split(' '); parts[parts.length - 1] = c; input.value = parts.join(' ') + ' '; updateGhost(); }
  }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hIndex > 0) { input.value = history[--hIndex]; updateGhost(); } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); hIndex = Math.min(history.length, hIndex + 1); input.value = history[hIndex] || ''; updateGhost(); }
});

/* ---------- fps: the compositor's own frame rate ---------- */
(function fpsLoop() {
  let frames = 0, last = performance.now();
  const el = $('#fps');
  (function tick(now) {
    frames++;
    if (now - last >= 500) { el.textContent = `${Math.round(frames * 1000 / (now - last))} fps`; frames = 0; last = now; }
    requestAnimationFrame(tick);
  })(last);
})();

/* ---------- startup ---------- */
async function startup() {
  const root = document.documentElement.style;
  const pref = (k, v, f) => { const s = store.get(k); if (s !== null) root.setProperty(v, f(s)); };
  pref('xk-blur', '--blur', s => s + 'px'); pref('xk-gap', '--gap', s => s + 'px'); pref('xk-radius', '--radius', s => s + 'px'); pref('xk-accent', '--accent', s => s);
  setWallpaper(store.get('xk-wall'));

  const bootLogo = boot.querySelector('.logo');
  await sleep(300); bootLogo.classList.add('show');
  await sleep(2000); bootLogo.classList.add('hop');
  await sleep(800); boot.classList.add('gone');

  // always there: bring back every kernel from last time
  const saved = JSON.parse(store.get('xk-tiles') || '[]');
  nextId = Math.max(+store.get('xk-next') || 1, ...saved.map(s => s.id + 1), 1);
  for (const s of saved) {
    await startKernel(s.key === 'linux' ? 'linux' : s.key, s.distro, { id: s.id, resume: true });
    await sleep(220);
  }

  const firstBoot = !store.get('xk-seen-xsh') || new URLSearchParams(location.search).has('firstboot');
  if (!firstBoot) return;
  await sleep(600);
  const words = welcome.querySelector('.words');
  welcome.querySelector('.l1').classList.add('show');
  await sleep(900);
  welcome.querySelector('.l2').classList.add('show');
  await sleep(2500);
  words.classList.add('collapse');
  await sleep(500);
  const logo = welcome.querySelector('.logo');
  logo.classList.add('show');
  await sleep(1600);
  logo.classList.add('out');
  await sleep(700);
  hint.classList.add('show');
}
startup();
</script>
</body>
</html>
